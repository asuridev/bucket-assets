# Maven Wrapper. distributionType=only-script: no hay ningun .jar en el repo, el propio
# mvnw descarga Apache Maven la primera vez y lo cachea en ~/.m2/wrapper.
# Cambiar de version de Maven es cambiar esta URL.
wrapperVersion=3.3.2
distributionType=only-script
distributionUrl=https://repo1.maven.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
