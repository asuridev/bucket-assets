  # Contenedor de un solo uso: MinIO arranca vacio y sin bucket la primera subida falla con
  # NoSuchBucket. Es idempotente y acaba en Exited (0), que es lo correcto.
  minio-init:
    image: __IMAGE_MC__
    container_name: infra-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 admin adminadmin &&
      mc mb --ignore-existing local/__BUCKET__ &&
      echo 'Bucket __BUCKET__ listo (privado)' "
