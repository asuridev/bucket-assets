  # Emula la API v2 de IBM Cloud Secrets Manager y el endpoint de token de IAM, para que el
  # servicio recorra en DevX el MISMO camino de codigo que en Code Engine: el mismo SDK, el
  # mismo canje de token y el mismo parseo. Mismo criterio que usar MinIO en vez del COS.
  #
  # NO es una UI: lo consume la aplicacion desde el propio workspace, no un navegador, asi que
  # es el unico servicio de este stack que NO necesita "Add Port" en el panel PORTS.
  #
  # Los stubs salen de conf/secrets-manager-stub/. El del secreto lo genera up.sh desde una
  # plantilla, porque lleva dentro las credenciales de MinIO y tienen que ser las de ESTE
  # entorno (admin/adminadmin), no las del compose de deploy/ (minioadmin).
  secrets-manager-stub:
    image: __IMAGE_WIREMOCK__
    container_name: infra-secrets-stub
    command: ["--verbose"]
    ports:
      # Literal, por el mismo motivo que el resto: el compose de DevX no sustituye dentro de
      # `ports`. El 8090 es el que ya trae por defecto el perfil `local` en SECRETS_URL, asi
      # que la aplicacion lo encuentra sin configurar nada.
      - "8090:8080"
    volumes:
      # El compose generado vive en generated/, de ahi el ../conf.
      - ../conf/secrets-manager-stub:/home/wiremock:ro
