  mongo:
    image: __IMAGE_MONGO__
    container_name: infra-mongo
    environment:
      # Variables de la imagen OFICIAL de MongoDB (no las MONGODB_* de Bitnami, que es lo que
      # habia aqui antes).
      #
      # El entrypoint oficial hace dos cosas con ellas: anade `--auth` a mongod por su cuenta y
      # crea este usuario con rol root sobre `admin`. Hacen falta LAS DOS: si solo se define una,
      # el contenedor aborta con exit 1 en vez de arrancar sin autorizacion.
      #
      # OJO: eso solo ocurre en la PRIMERA inicializacion, con el directorio de datos vacio. El
      # entrypoint se salta el init si ya encuentra /data/db/WiredTiger (o journal, local.0,
      # storage.bson), asi que sobre un volumen con datos previos estas variables no hacen nada.
      # Por eso el volumen de abajo se llama -v8: el stack anterior usaba `mongo-data` con el
      # layout de Bitnami en /bitnami/mongodb, y reaprovecharlo aqui habria dado un mongod con
      # autorizacion activada y CERO usuarios, que es justo el fallo dificil de diagnosticar.
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    ports:
      - "27017:27017"
    volumes:
      # La imagen oficial guarda los datos aqui, no en /bitnami/mongodb.
      - mongo-data-v8:/data/db
    healthcheck:
      # Una sola shell, a diferencia de la cascada de cuatro que hubo aqui mientras la version del
      # servidor dependia del registro: con el tag fijado, `mongosh` esta siempre en el PATH.
      # `ping` es uno de los comandos que mongod acepta sin autenticar, asi que el test funciona
      # aunque --auth este activo.
      test:
        - CMD-SHELL
        - mongosh --quiet --eval "db.adminCommand('ping').ok"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s
