  oracle:
    image: __IMAGE_ORACLE__
    container_name: infra-oracle
    environment:
      # Variables de las imagenes de gvenzl (las de Docker Hub, sin login ni aceptar licencia).
      #
      # ORACLE_PASSWORD es la de SYS/SYSTEM. APP_USER/APP_USER_PASSWORD crean un usuario normal
      # dentro de la PDB (FREEPDB1) con su tablespace, que es con el que se conecta la UI: para
      # trastear no hace falta SYSDBA, y asi un DROP de mas no se lleva por delante la instancia.
      #
      # OJO, misma trampa que en mongo.yaml: esto SOLO ocurre en la primera inicializacion, con
      # el volumen vacio. El entrypoint se salta el init si ya encuentra la base en
      # /opt/oracle/oradata, asi que sobre un volumen con datos previos estas variables no hacen
      # nada y un cambio de contrasena aqui no llega a aplicarse nunca. Sintoma: ORA-01017.
      # Remedio: ./down.sh -v
      ORACLE_PASSWORD: __ORACLE_PASSWORD__
      APP_USER: __ORACLE_USER__
      APP_USER_PASSWORD: __ORACLE_PASSWORD__
    ports:
      # Literal, NUNCA "${VAR:-1521}": el compose de DevX no sustituye dentro de ports: y parte
      # la cadena por los dos puntos, con lo que sale un "invalid literal for int()".
      #
      # 1521 es TCP puro, asi que desde DevX NO se ve: ese entorno solo publica HTTP bajo
      # subpath. Sirve para conectar desde el propio workspace (JDBC, sqlplus si lo hubiera);
      # desde el navegador la unica via es la UI del 8083.
      - "1521:1521"
    volumes:
      # La imagen guarda aqui los datafiles.
      #
      # La imagen trae los datafiles COMPRIMIDOS y los descomprime aqui en el primer arranque
      # (~7 s, 3,0 GB en el volumen, medidos). Por eso la imagen es la -slim y NO la
      # -slim-faststart: aquella lleva la base ya descomprimida dentro, y con un volumen
      # montado encima acaba almacenada DOS veces -- 5,1 GB de imagen mas 3,0 GB de volumen,
      # frente a 1,97 + 3,0. En DevX eso es un 'no space left on device'. Lo que se paga a
      # cambio son 7 segundos.
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      # healthcheck.sh lo trae la propia imagen y comprueba que la instancia esta ABIERTA, no
      # solo que el listener responde.
      test:
        - CMD-SHELL
        - healthcheck.sh
      interval: 10s
      timeout: 10s
      # Mucho mas holgado que el de mongo: Oracle tarda en abrir la instancia, y el primer
      # arranque ademas copia la base al volumen.
      retries: 30
      start_period: 60s
