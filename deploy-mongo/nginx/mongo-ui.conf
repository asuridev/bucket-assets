# PLANTILLA. El fichero que se monta en el contenedor es mongo-ui.conf, generado de aqui:
#
#   cd deploy-mongo/nginx
#   sed 's||<tu-prefijo>|g' default.conf.template > mongo-ui.conf
#
# con <tu-prefijo> = /user/<usuario>/http/8082 en DevX, y VACIO en local (todas las
# sustituciones quedan como identidades y el shim no hace nada).
#
# Se genera a mano, y no con envsubst al arrancar, a proposito: la imagen de Bitnami no tiene
# el mecanismo de plantillas de la oficial, y cualquier alternativa (command: en el YAML, o un
# script montado) depende de como el compose de turno expanda el "$" o de que el fichero este
# donde toca. Un .conf ya resuelto no depende de nada.
#
# Shim entre "el navegador vive bajo /user/<usuario>/http/8082/" y "mongo-express cree estar
# en la raiz": mongo-express pide sus assets con rutas absolutas y DevX recorta el prefijo.
server {
    listen 8082;
    server_name _;

    # Los ficheros de GridFS y los import de coleccion pueden ser grandes.
    client_max_body_size 64m;

    # Location siempre relativo. Por defecto nginx lo reconstruye como
    # http://<host>/... y en DevX, que sirve por https, eso degrada el esquema.
    absolute_redirect off;

    location / {
        proxy_pass http://mongo-express:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Imprescindible: sin esto la respuesta llega comprimida y sub_filter no puede tocarla.
        proxy_set_header Accept-Encoding "";

        # 1. El <base href> que emite mongo-express, para todo lo que sea relativo.
        sub_filter '<base href="/">' '<base href="/">';
        # 2. Sus assets son ABSOLUTOS (/public/css/style.css) y <base> no afecta a URLs
        #    absolutas, asi que hay que reescribir atributo por atributo. Los enlaces externos
        #    (href="https://cdnjs...") no casan, porque el patron exige la barra tras la comilla.
        sub_filter 'href="/'   'href="/';
        sub_filter 'src="/'    'src="/';
        sub_filter 'action="/' 'action="/';
        sub_filter_once off;
        # sub_filter_types no se declara: text/html ya viene por defecto, y repetirlo hace que
        # nginx avise con "duplicate MIME type" en cada arranque.

        # Los 302 de mongo-express salen sin prefijo, y a veces absolutos
        # (http://<host>/db/foo). La regla con regex los deja SIEMPRE relativos y con
        # prefijo: absolutos con esquema http reventarian en DevX, que sirve por https.
        proxy_redirect ~^https?://[^/]+/(.*)$ /$1;
        proxy_redirect / /;
    }
}
