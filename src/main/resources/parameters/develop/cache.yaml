# Cache de Redis de desarrollo. CACHE_ENABLED=false deja el servicio hablando solo con el
# COS, sin tocar codigo, mientras no haya instancia de Redis provisionada.
cache:
  enabled: ${CACHE_ENABLED:true}
  ttl-minutes: ${CACHE_TTL_MINUTES:60}

spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Password de Redis. Va vacia por defecto porque una instancia sin auth es
      # legitima; cuando la hay, el valor sale del secreto de Secrets Manager, que
      # publica REDIS_PASSWORD como propiedad (ver secret-manager.md).
      password: ${REDIS_PASSWORD:}
