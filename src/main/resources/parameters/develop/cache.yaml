# Cache de Redis de desarrollo.
#
# Aqui NO se configura la conexion. Host, puerto, usuario, password y TLS salen del service
# credential que se lee al arrancar (secrets.redis.* -> IbmRedisCredentialsSource), que es el
# unico sitio que define spring.data.redis.*.
#
# CACHE_ENABLED=false es el unico interruptor: quita el decorador Y deja de leer el secreto de
# Redis, que es lo que hay que usar mientras no haya instancia provisionada.
cache:
  enabled: ${CACHE_ENABLED:true}
  ttl-minutes: ${CACHE_TTL_MINUTES:60}
