# Secrets Manager real. Esta rama solo valida la conexion a Redis, asi que el UNICO secreto
# que se lee es el service credential de abajo.
#
# Lo obligatorio no lleva default: arrancar sin saber de donde leer los secretos es un fallo de
# despliegue y debe verse al arrancar.
secrets:
  enabled: ${SECRETS_ENABLED:true}

  url: ${SECRETS_URL}
  iam-url: ${SECRETS_IAM_URL:https://iam.cloud.ibm.com}

  # La unica credencial que sigue siendo variable de entorno plana: es la llave con la que se
  # abren las demas, asi que no puede estar dentro de lo que abre. Sin default, igual que
  # SECRETS_URL: arrancar sin ella es un fallo de despliegue y debe verse al desplegar.
  #
  # Que no lleve default es seguro porque SecretsEnvironmentPostProcessor enlaza
  # secrets.enabled aparte y ANTES que el resto: con SECRETS_ENABLED=false nunca se llega a
  # resolver este placeholder.
  api-key: ${IBM_CLOUD_API_KEY}

  # --- Secreto kv: NO se usa en esta rama ---------------------------------------------
  # El codigo que lo lee (IbmSecretsManagerSource) esta intacto; solo esta desactivado, y
  # desactivar es exactamente "no declarar el nombre". Para empezar a usarlo:
  #
  #   1. descomenta estas dos lineas
  #   2. consume sus claves como ${MI_VARIABLE} desde cualquier YAML de este perfil
  #
  # No hay paso 3: no se toca Java. Las claves del secreto se llaman igual que las variables.
  #
  # name: ${SECRETS_NAME:contentms-secrets}
  # group: ${SECRETS_GROUP:default}

  # --- Service credential de Redis: esto SI se usa -------------------------------------
  # De aqui salen host, puerto, usuario de ACL, password y la CA del TLS, ya como propiedades
  # spring.data.redis.* y spring.ssl.bundle.pem.*. Es el unico sitio que las define.
  #
  # No lleva interruptor propio: lo manda cache.enabled. Sin cache no hay conexion que
  # configurar, y con cache encendida este secreto es obligatorio.
  redis:
    name: ${SECRETS_REDIS_NAME:contentms-redis-credentials}
    # Declara su propio grupo en vez de heredarlo del secreto kv, que aqui no existe: una
    # herencia de una clave comentada seria una indireccion invisible.
    group: ${SECRETS_REDIS_GROUP:default}
