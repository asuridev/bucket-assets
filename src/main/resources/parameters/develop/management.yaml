management:
  # El starter de Redis anade su propio indicador de salud, y con el /actuator/health se
  # pone DOWN en cuanto Redis no responde. Aqui eso seria un contrasentido: la cache degrada
  # a miss y el servicio sigue sirviendo archivos desde el COS, asi que marcar el pod como
  # enfermo solo consigue que Code Engine lo reinicie sin motivo.
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      # never, igual que production: el detalle de cada componente de salud saldria SIN
      # autenticacion ninguna, y el escaneo de seguridad lo marca. No se usa when-authorized
      # porque sin Spring Security no hay usuario autenticado nunca: se comportaria igual que
      # never, sugiriendo una autorizacion que no existe. En local sigue en always.
      show-details: never
