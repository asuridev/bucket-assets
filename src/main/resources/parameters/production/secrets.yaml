# Secrets Manager real. De aqui salen COS_API_KEY, COS_SERVICE_INSTANCE_ID y REDIS_PASSWORD,
# que los YAML de este perfil siguen leyendo como ${VARIABLE} sin saber de donde vienen.
#
# Lo obligatorio no lleva default, igual que las credenciales del COS: arrancar sin saber de
# donde leer los secretos es un fallo de despliegue y debe verse al arrancar.
secrets:
  enabled: ${SECRETS_ENABLED:true}

  url: ${SECRETS_URL}
  iam-url: ${SECRETS_IAM_URL:https://iam.cloud.ibm.com}
  # Vacio = no hay secreto kv y no se lee ninguno. Tiene sentido para un servicio cuyas
  # credenciales llegan todas como service credentials; aqui las del COS salen de este, asi
  # que vaciarlo obliga a que COS_API_KEY y COS_SERVICE_INSTANCE_ID lleguen por otra via.
  name: ${SECRETS_NAME:contentms-secrets}
  group: ${SECRETS_GROUP:default}

  # La unica credencial que sigue siendo variable de entorno plana: es la llave con la que se
  # abren las demas, asi que no puede estar dentro de lo que abre. Sin default, igual que
  # SECRETS_URL: arrancar sin ella es un fallo de despliegue y debe verse al desplegar.
  #
  # Que no lleve default es seguro porque SecretsEnvironmentPostProcessor enlaza
  # secrets.enabled aparte y ANTES que el resto: con SECRETS_ENABLED=false nunca se llega a
  # resolver este placeholder.
  api-key: ${IBM_CLOUD_API_KEY}

  # Service credential de Redis. Es un secreto APARTE del kv de arriba, y no por gusto: un
  # service_credentials pertenece a UNA instancia enlazada, asi que las credenciales del COS
  # y las de Redis no pueden compartir secreto. Ver credenciales-ibm-cloud.md.
  #
  # No lleva interruptor propio: lo manda cache.enabled. Sin cache no hay conexion a Redis que
  # configurar, y con cache encendida este secreto es obligatorio.
  redis:
    name: ${SECRETS_REDIS_NAME:contentms-redis-credentials}
    # OJO: este es el grupo del secreto de REDIS, no el de arriba. Son dos secretos
    # distintos (un service_credentials pertenece a UNA instancia enlazada). Vacio hereda el
    # grupo del secreto principal, que es lo normal: solo se rellena si DevOps deja el de
    # Redis en otro grupo, y entonces la service ID necesita permiso sobre los dos.
    group: ${SECRETS_REDIS_GROUP:}
