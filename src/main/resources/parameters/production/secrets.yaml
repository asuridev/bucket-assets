# Secrets Manager real. De aqui salen COS_API_KEY, COS_SERVICE_INSTANCE_ID y REDIS_PASSWORD,
# que los YAML de este perfil siguen leyendo como ${VARIABLE} sin saber de donde vienen.
#
# Lo obligatorio no lleva default, igual que las credenciales del COS: arrancar sin saber de
# donde leer los secretos es un fallo de despliegue y debe verse al arrancar.
secrets:
  enabled: ${SECRETS_ENABLED:true}

  # apikey  -> hace falta IBM_CLOUD_API_KEY (la unica credencial que sigue siendo variable
  #            de entorno plana: es la llave con la que se abren las demas)
  # container -> ninguna credencial: se usa el token que la plataforma monta en el pod,
  #            canjeado contra un trusted profile. Requiere que DevOps lo haya enlazado.
  # Conmutar es esta variable y reiniciar. Ver secret-manager.md.
  auth-mode: ${SECRETS_AUTH_MODE:apikey}

  url: ${SECRETS_URL}
  iam-url: ${SECRETS_IAM_URL:https://iam.cloud.ibm.com}
  name: ${SECRETS_NAME:contentms-secrets}
  group: ${SECRETS_GROUP:default}

  # Solo en modo apikey. Lleva default vacio a proposito: en modo container esta variable
  # NO debe existir, y sin default el arranque reventaria por un placeholder sin resolver
  # antes de poder decir nada util. Que falte estando en modo apikey lo detecta
  # IbmSecretsManagerSource, con un mensaje que nombra el modo.
  api-key: ${IBM_CLOUD_API_KEY:}

  # Solo en modo container: uno de los dos es obligatorio ahi.
  iam-profile-name: ${SECRETS_IAM_PROFILE_NAME:}
  iam-profile-id: ${SECRETS_IAM_PROFILE_ID:}
  # Vacio = las tres rutas por defecto del SDK, una de ellas la de Code Engine. Solo hace
  # falta fijarlo si se despliega en un runtime que monte el token en otro sitio.
  cr-token-filename: ${SECRETS_CR_TOKEN_FILE:}
