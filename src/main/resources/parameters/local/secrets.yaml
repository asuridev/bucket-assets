# Mismo cliente y mismo SDK que en produccion: lo unico que cambia es contra quien. Aqui el
# destino es el stub de WireMock que levanta deploy/docker-compose.yaml, que responde tanto
# al endpoint de token de IAM como a la API v2 de Secrets Manager. Pasar a develop o
# production es cambiar estas URLs y la credencial: cero codigo.
#
# Con el compose parado, SECRETS_ENABLED=false deja arrancar sin stub (los secretos, que en
# local no son tales, salen de los defaults de storage.yaml y cache.yaml).
secrets:
  enabled: ${SECRETS_ENABLED:true}

  # apikey | container. En local el default es apikey, que es lo unico que funciona sin
  # plataforma. El modo container tambien se puede ensayar aqui: ver secret-manager.md y
  # deploy/secrets-manager-stub/README.md.
  auth-mode: ${SECRETS_AUTH_MODE:apikey}

  url: ${SECRETS_URL:http://localhost:8090}
  iam-url: ${SECRETS_IAM_URL:http://localhost:8090}
  name: ${SECRETS_NAME:contentms-secrets}
  group: ${SECRETS_GROUP:default}

  # Solo en modo apikey. El stub no valida nada: cualquier valor sirve.
  api-key: ${IBM_CLOUD_API_KEY:local-fake-api-key}

  # Solo en modo container. Vacios por defecto porque el modo tampoco lo esta.
  iam-profile-name: ${SECRETS_IAM_PROFILE_NAME:}
  iam-profile-id: ${SECRETS_IAM_PROFILE_ID:}
  # Vacio deja que el SDK pruebe sus tres rutas por defecto (una es la de Code Engine). En
  # local se apunta al token de mentira del stub para poder ensayar el modo sin plataforma.
  cr-token-filename: ${SECRETS_CR_TOKEN_FILE:}
