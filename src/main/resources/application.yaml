# Configuracion comun a todos los perfiles. Lo que varia por entorno vive en
# parameters/<perfil>/, y cada application-<perfil>.yaml solo hace el import.
server:
  port: ${SERVER_PORT:8080}
  # Apagado ordenado: al recibir SIGTERM deja de aceptar conexiones nuevas y espera
  # a que terminen las en curso. Code Engine manda SIGTERM al reescalar.
  shutdown: graceful

spring:
  application:
    name: content-ms
  lifecycle:
    timeout-per-shutdown-phase: ${SHUTDOWN_TIMEOUT:30s}
  threads:
    virtual:
      enabled: true
  profiles:
    active: ${PROFILE:local}
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: always
springdoc:
  swagger-ui:
    path: /swagger-ui.html
